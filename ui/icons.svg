  </symbol>

  <symbol id="open" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 4.25H5.75a1.5 1.5 0 0 0-1.5 1.5v8.5a1.5 1.5 0 0 0 1.5 1.5h8.5a1.5 1.5 0 0 0 1.5-1.5V11.5"/>
    <path d="M11.5 4.25h4.25V8.5M15.5 4.5l-6 6"/>
  </symbol>

  <symbol id="copy" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="7" width="9.5" height="9.5" rx="1.75"/>
    <path d="M13 7V5.25a1.75 1.75 0 0 0-1.75-1.75h-6A1.75 1.75 0 0 0 3.5 5.25v6A1.75 1.75 0 0 0 5.25 13H7"/>
  </symbol>

  <symbol id="image" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.75" y="3.75" width="14.5" height="12.5" rx="1.75"/>
    <circle cx="7" cy="8" r="1.25"/>
    <path d="m3.25 14.25 4-3.75 2.75 2.5 2.25-2 4.5 4"/>
  </symbol>

  <symbol id="link" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.6 11.4a3 3 0 0 0 4.24 0l2.6-2.6a3 3 0 0 0-4.24-4.24l-.85.85"/>
    <path d="M11.4 8.6a3 3 0 0 0-4.24 0l-2.6 2.6a3 3 0 0 0 4.24 4.24l.85-.85"/>
  </symbol>

  <symbol id="delete" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 5.5h13M8 5.5V4.25a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V5.5"/>
    <path d="m5 5.5.7 10.1a1.5 1.5 0 0 0 1.5 1.4h5.6a1.5 1.5 0 0 0 1.5-1.4L15 5.5M8.5 8.75v5M11.5 8.75v5"/>
