  <symbol id="alert" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7.25"/>
    <path d="M10 6.25v4.5M10 13.75h.01"/>
  </symbol>

  <!-- editor tools -->
  <symbol id="tool-select" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m5 3.5 10 5.25-4.25 1.25 3 4.75-1.75 1-3-4.75L5.75 14Z"/>
  </symbol>

  <symbol id="tool-pen" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.25 3.75a1.77 1.77 0 0 1 2.5 2.5L7 15l-3.25.75L4.5 12.5Z"/>
    <path d="m11.75 5.25 2.5 2.5"/>
  </symbol>

  <symbol id="tool-highlighter" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m11.5 3.5 5 5-6 6H8.25L5.5 11.75V9.5Z"/>
    <path d="m5.5 11.75-2 2 2.75 2.75 2-2M3 17.25h5"/>
  </symbol>

  <symbol id="tool-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 16 16 4M9 4h7v7"/>
  </symbol>

  <symbol id="tool-line" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 16 16 4"/>
  </symbol>

  <symbol id="tool-rect" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.25" y="4.75" width="13.5" height="10.5" rx="1.5"/>
  </symbol>

  <symbol id="tool-ellipse" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="10" cy="10" rx="7" ry="5.5"/>
  </symbol>

  <symbol id="tool-text" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 5.5V4h11v1.5M10 4v12M7.75 16h4.5"/>
  </symbol>

  <symbol id="tool-emoji" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7"/>
    <path d="M7.25 11.75a3.25 3.25 0 0 0 5.5 0M7.75 8h.01M12.25 8h.01"/>
  </symbol>

  <symbol id="tool-blur" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.25" y="3.25" width="13.5" height="13.5" rx="1.5"/>
    <path d="M3.25 7.75h4.5v4.5h-4.5M12.25 3.25v4.5h4.5M7.75 12.25h4.5v4.5M12.25 7.75v4.5h4.5"/>
  </symbol>

  <symbol id="tool-crop" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 2.75v10.5a1.25 1.25 0 0 0 1.25 1.25h10.5M2.75 5.5h10.5a1.25 1.25 0 0 1 1.25 1.25v10.5"/>
  </symbol>

  <symbol id="undo" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 5 4 8.5 7.5 12"/>
    <path d="M4 8.5h7.5a4.5 4.5 0 0 1 0 9H9"/>
  </symbol>

  <symbol id="redo" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 5 16 8.5 12.5 12"/>
    <path d="M16 8.5H8.5a4.5 4.5 0 0 0 0 9H11"/>
  </symbol>

  <symbol id="text-scan" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6.5V4.5A1.5 1.5 0 0 1 4.5 3h2M13.5 3h2A1.5 1.5 0 0 1 17 4.5v2M17 13.5v2a1.5 1.5 0 0 1-1.5 1.5h-2M6.5 17h-2A1.5 1.5 0 0 1 3 15.5v-2"/>
    <path d="M6.5 7h7M6.5 10h7M6.5 13h4"/>
  </symbol>

  <symbol id="save" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 3.25h8.75l3.5 3.5v9.5a1.5 1.5 0 0 1-1.5 1.5h-10.75a1.5 1.5 0 0 1-1.5-1.5v-11.5a1.5 1.5 0 0 1 1.5-1.5Z"/>
    <path d="M6.5 3.25v3.5h6v-3.5M6.5 17.75v-5h7v5"/>
  </symbol>

  <symbol id="edit" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.25 3.75a1.77 1.77 0 0 1 2.5 2.5L7 15l-3.25.75L4.5 12.5Z"/>
  </symbol>

  <symbol id="timer" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="11" r="6.25"/>
    <path d="M10 7.75V11l2 1.5M8 2.75h4"/>
  </symbol>

  <symbol id="sound" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.75 7.75h2.5L10 4.5v11l-3.75-3.25h-2.5Z"/>
    <path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.25 5.25a6.75 6.75 0 0 1 0 9.5"/>
  </symbol>
</svg>
